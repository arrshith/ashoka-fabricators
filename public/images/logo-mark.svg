<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 37" role="img" aria-label="Ashoka">
<!--
  Ashoka wordmark, vectorised from the 2000x2000 artwork supplied by the client
  (kept at assets/source-images/logo-hires.webp).

  Traced, not redrawn: marching-squares contours over the red channel of the
  real artwork, simplified with Ramer-Douglas-Peucker. The letterforms, the
  keyline and the red counters inside A/o/a are all the actual shapes.

  Two paths, layered:
    1. white underlay, bounded by the keyline's OUTER edge. Deliberately not the
       badge edge, so no white can fringe the badge outline on a dark surface.
    2. the red, as every traced contour under fill-rule="evenodd". Nesting then
       resolves by itself: red band -> white keyline -> red field -> white
       letters -> red counters.

  The silver bevel in the source is a 3D render treatment, not part of the flat
  mark, so it is not reproduced. #D6382A is sampled from the artwork.
-->
